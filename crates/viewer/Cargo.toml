[package]
name = "viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native GTK4 viewer for Linux/Windows (GUI + headless): port-1 connect, VA-API H.264 decode, dmabuf render, input + clipboard."

[[bin]]
name = "rmng-viewer"
path = "src/main.rs"

[dependencies]
wire.workspace = true
viewer-core = { path = "../viewer-core" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# VA-API H.264 decode via GStreamer (vah264dec). The GUI sink (GdkDmabufTexture)
# adds gtk4 in the next increment; the decode/transport core is toolkit-free so
# the headless test mode needs no display.
gstreamer = "0.23"
gstreamer-app = "0.23"
# BaseTransform/GLFilter subclassing for the zero-copy AVC444 GL unpacker (src/glunpack.rs).
gstreamer-base = "0.23"
gstreamer-video = { version = "0.23", features = ["v1_24"] }
gstreamer-allocators = "0.23"
gstreamer-gl = { version = "0.23", features = ["v1_24"] }
gtk4 = { version = "0.9", package = "gtk4", features = ["v4_14"] }
serde.workspace = true
serde_json.workspace = true
# Full terminal engine (grid, scrollback, selection, mouse/app modes) for the headless-clone
# tmux tab view (src/terminal.rs). We feed the server's raw PTY bytes and render its grid into a
# GTK DrawingArea with cairo — no system terminal lib (unlike the GTK VTE widget), so the tab
# view is ours on every platform. Its unused PTY-spawn deps are harmless compile weight.
alacritty_terminal = "0.26"

# Pointer-lock / relative mouse (Wayland only; gdk4-wayland links libwayland, which is Linux's).
# The pointer_lock module is gated by the same cfg; Windows gets the no-op stub instead.
[target.'cfg(target_os = "linux")'.dependencies]
# `wayland_crate` re-exports a version-matched wayland-client (0.31, matching gtk4 0.9).
gdk4-wayland = { version = "0.9", features = ["wayland_crate"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
