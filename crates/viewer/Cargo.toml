[package]
name = "viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native GTK4 viewer (GUI + headless): port-1 connect, VA-API H.264 decode, dmabuf render, input + clipboard."

[[bin]]
name = "rmng-viewer"
path = "src/main.rs"

[dependencies]
wire.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# VA-API H.264 decode via GStreamer (vah264dec). The GUI sink (GdkDmabufTexture)
# adds gtk4 in the next increment; the decode/transport core is toolkit-free so
# the headless test mode needs no display.
gstreamer = "0.23"
gstreamer-app = "0.23"
# BaseTransform/GLFilter subclassing for the zero-copy AVC444 GL unpacker (src/glunpack.rs).
gstreamer-base = "0.23"
gstreamer-video = { version = "0.23", features = ["v1_24"] }
# NOTE: no `gstreamer-allocators` here. It was listed since the initial commit but no viewer
# source ever referenced it — the crate's users are `media` and `clone-daemon`, which allocate
# DmaBuf on the capture/encode side. Keeping it would have made the viewer unbuildable on
# Windows for nothing: gstreamer-allocators 0.23.5 declares `std::os::unix` unconditionally
# (`fd_allocator.rs`), so it fails to compile on any non-Unix target.
gstreamer-gl = { version = "0.23", features = ["v1_24"] }
gtk4 = { version = "0.9", package = "gtk4", features = ["v4_14"] }
serde.workspace = true
serde_json.workspace = true
# Full terminal engine (grid, scrollback, selection, mouse/app modes) for the headless-clone
# tmux tab view (src/terminal.rs). We feed the server's raw PTY bytes and render its grid into a
# GTK DrawingArea with cairo — no system terminal lib, so it builds and runs identically on Linux
# and macOS (unlike the GTK VTE widget). Its unused PTY-spawn deps are harmless compile weight.
alacritty_terminal = "0.26"

# Pointer-lock / relative mouse (Wayland only; gdk4-wayland links a C lib that
# does not exist on macOS).  The pointer_lock module is gated by the same cfg.
[target.'cfg(target_os = "linux")'.dependencies]
# `wayland_crate` re-exports a version-matched wayland-client (0.31, matching gtk4 0.9).
gdk4-wayland = { version = "0.9", features = ["wayland_crate"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

# macOS pointer-lock via CGAssociateMouseAndMouseCursorPosition + NSEvent local monitor.
# No TCC permission required for local monitors.
[target.'cfg(target_os = "macos")'.dependencies]
# CGAssociateMouseAndMouseCursorPosition, CGDisplayHideCursor, kCGDirectMainDisplay.
core-graphics = "0.25"
# NSEvent (local monitor API + deltaX/deltaY), NSCursor (hide/unhide), NSEventMask.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    # pointer-lock (pre-existing)
    "NSEvent",
    "NSCursor",
    # native_titlebar: NSWindow titlebar configuration
    "NSWindow",
    "NSResponder",
    # native_titlebar: titlebar accessory view controller
    "NSTitlebarAccessoryViewController",
    "NSViewController",
    # native_titlebar: container view + subviews
    "NSView",
    # native_titlebar: NSButton action bridge
    "NSButton",
    "NSControl",
    # native_titlebar: NSImage (SF Symbol icons)
    "NSImage",
    # native_titlebar: NSLayoutAttribute::Right for accessory placement
    "NSLayoutConstraint",
] }
# Block closures for the addLocalMonitorForEventsMatchingMask:handler: callback.
block2 = "0.6"

# Windows pointer-lock (ClipCursor + Raw Input, src/pointer_lock_win.rs) and the
# VK → set-1 scancode inversion the keymap needs (src/vk_evdev.rs).
# `windows-sys` rather than `windows`: these are plain C entry points and POD structs, with no
# COM, no WinRT and no interface machinery to justify the heavier bindings.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    # HWND/LPARAM/LRESULT/WPARAM, POINT, RECT.
    "Win32_Foundation",
    # Window class + message-only window, the message pump, ClipCursor/GetCursorPos, SetTimer.
    "Win32_UI_WindowsAndMessaging",
    # `WNDCLASSW` embeds HICON/HCURSOR/HBRUSH, so windows-sys gates both it and
    # `RegisterClassW` behind the GDI feature — even though this viewer draws no GDI at all.
    "Win32_Graphics_Gdi",
    # RegisterRawInputDevices / GetRawInputData and the RAWINPUT structures.
    "Win32_UI_Input",
    # MapVirtualKeyW + MAPVK_VK_TO_VSC_EX (vk_evdev).
    "Win32_UI_Input_KeyboardAndMouse",
] }
