[package]
name = "rmng-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "rmng — fleet management CLI for the RMNG control-server (hosts, clones, images, accounts, operations)."

[[bin]]
name = "rmng"
path = "src/main.rs"

[dependencies]
wire.workspace = true
control-client.workspace = true
serde.workspace = true
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
futures.workspace = true
# The ticket verbs call `api.linear.app` themselves (see `src/linear.rs`).
reqwest.workspace = true
base64 = "0.22"

# `poll(2)` on stdin so `rmng exec` only drains piped input that is actually
# ready, instead of blocking forever on an idle open pipe (a script / agent
# harness / fleet driver that holds stdin open without writing) — see
# `commands::stdin_has_input`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
