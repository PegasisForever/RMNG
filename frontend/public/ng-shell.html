<!doctype html>
<!--
  `/ng`: the shell around the /ng app. The server sends this file for `/ng`
  (`crates/control-server/src/web.rs`); the app itself is `/ng/app`, in the frame below.

  A new server build reloads the app (`frontend/app/ng/session.ts`, `useLiveState`, `pwa.ts`).
  A reload of the whole page ends the fullscreen and the key lock, so the app runs in this
  frame, and this page, which does not change with the builds, keeps them: the app asks this
  window for the fullscreen and the key lock (`frontend/app/lib/host.ts`). A new build reloads
  only the frame. This page has no build step and no code files: change it rarely, and keep
  `window.rmngShell` compatible with older apps.

  A browser with no fullscreen (an iPhone) gets nothing from the frame: it goes to the app.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>RMNG</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="theme-color" content="#000000" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color-scheme: dark;
      }
      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      /* The clock bar's and the home bar's insets: a frame sees none of its own */
      #inset {
        position: fixed;
        inset: 0;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="inset"></div>
    <script>
      (function () {
        var app = "/ng/app" + location.search + location.hash;
        if (!document.fullscreenEnabled) {
          location.replace(app);
          return;
        }
        // What the app asks of this window (`frontend/app/lib/host.ts`). The app reaches the
        // rest of this window itself (same origin): its document, fullscreen, key lock, name,
        // address, title.
        window.rmngShell = {
          version: 1,
          /** The home bar's inset, CSS px. */
          insetBottom: function () {
            return parseFloat(getComputedStyle(document.getElementById("inset")).paddingBottom) || 0;
          },
          /** The clock bar's inset, CSS px. */
          insetTop: function () {
            return parseFloat(getComputedStyle(document.getElementById("inset")).paddingTop) || 0;
          },
        };
        var frame = document.createElement("iframe");
        frame.src = app;
        frame.allow =
          "fullscreen; clipboard-read; clipboard-write; microphone; autoplay; screen-wake-lock; keyboard-map";
        // The keys go to the app: this page has nothing to type into
        frame.onload = function () {
          frame.focus();
        };
        window.addEventListener("focus", function () {
          frame.focus();
        });
        document.body.appendChild(frame);
      })();
    </script>
  </body>
</html>
